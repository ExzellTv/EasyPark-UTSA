<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live parking detection feed — real-time spot occupancy at UTSA campus" />
  <meta name="theme-color" content="#0f172a" />
  <title>Live Feed | EasyPark UTSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Fira Sans', sans-serif; }
    body { background-color: #0f172a; }
    .mono { font-family: 'Fira Code', monospace; }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
    }

    .stat-pill {
      background: #0f172a;
      border: 1px solid #334155;
    }

    .video-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    .spot-item {
      background: #0f172a;
      border: 1px solid #334155;
      transition: border-color 150ms ease;
    }
    .spot-item:hover { border-color: #475569; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .live-dot { animation: pulse 2s ease-in-out infinite; }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }
  </style>
  <script>
    let errorCount = 0;
    const MAX_ERRORS = 3;

    async function fetchSpots() {
      try {
        const res = await fetch("/parking/spots");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const { total, occupied, available } = data.summary;
        setVal("openCount",  available, "text-emerald-400");
        setVal("occCount",   occupied,  "text-red-400");
        setVal("totalCount", total,     "text-slate-300");

        const list = document.getElementById("spotList");
        list.innerHTML = "";
        data.spots.forEach(s => {
          const isOcc = s.status === "occupied";
          const item = document.createElement("li");
          item.className = `spot-item px-3 py-2.5 rounded-lg flex items-center justify-between`;
          item.setAttribute("role", "listitem");
          item.setAttribute("aria-label", `Spot ${s.id} is ${s.status}`);
          item.innerHTML = `
            <span class="text-xs text-slate-400 mono">Spot ${s.id}</span>
            <span class="text-xs font-medium mono ${isOcc ? "text-red-400" : "text-emerald-400"}">${s.status}</span>
          `;
          list.appendChild(item);
        });

        errorCount = 0;
        hideError();
      } catch (e) {
        errorCount++;
        if (errorCount >= MAX_ERRORS) showError(e.message);
      }
    }

    function setVal(id, value, colorClass) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = value;
        el.className = `text-4xl font-semibold mono ${colorClass} mb-1`;
      }
    }

    function showError(msg) {
      const el = document.getElementById("error-banner");
      if (el) { el.textContent = `Failed to load data: ${msg}`; el.classList.remove("hidden"); }
    }
    function hideError() {
      const el = document.getElementById("error-banner");
      if (el) el.classList.add("hidden");
    }

    setInterval(fetchSpots, 2000);
    window.onload = () => { fetchSpots(); };
  </script>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

  <div id="error-banner" role="alert" aria-live="assertive"
       class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-900/90 border border-red-700 text-red-200 px-5 py-2.5 rounded-lg text-sm max-w-sm text-center backdrop-blur-sm">
  </div>

  <header class="border-b border-slate-800 py-5" role="banner">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/" class="flex items-center gap-2.5 group" aria-label="Back to dashboard">
          <div class="w-8 h-8 bg-emerald-500 rounded-md flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7M12 3v18"/>
            </svg>
          </div>
          <span class="text-base font-semibold tracking-tight">EasyPark UTSA</span>
        </a>
        <div class="flex items-center gap-1.5" aria-label="Live stream active">
          <span class="w-1.5 h-1.5 bg-red-500 rounded-full live-dot"></span>
          <span class="text-xs text-slate-500 mono uppercase tracking-wider">Live</span>
        </div>
      </div>
      <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors cursor-pointer mono">← Dashboard</a>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full px-6 py-10 grid lg:grid-cols-3 gap-6" role="main">

    <!-- Video -->
    <div class="lg:col-span-2 flex flex-col">
      <h2 class="text-sm font-semibold text-slate-400 mono uppercase tracking-wider mb-4">Live Detection Feed</h2>
      <div class="video-container">
        <img id="video-feed" src="/parking/video_feed"
             alt="Live parking detection feed showing real-time spot occupancy"
             class="w-full h-auto block"
             onerror="document.getElementById('error-banner').textContent='Video feed unavailable'; document.getElementById('error-banner').classList.remove('hidden')" />
      </div>
      <p class="text-xs text-slate-600 mono mt-3 text-center">MJPEG stream · refreshes every ~50ms</p>
    </div>

    <!-- Stats -->
    <div class="panel rounded-xl p-6 flex flex-col">
      <h3 class="text-xs font-semibold text-slate-500 mono uppercase tracking-wider mb-5">Current Status</h3>

      <div class="space-y-3 mb-6">
        <div class="stat-pill rounded-lg p-4 text-center">
          <p class="text-4xl font-semibold mono text-emerald-400 mb-1" id="openCount">–</p>
          <p class="text-xs text-slate-500 uppercase tracking-wide">Available</p>
        </div>
        <div class="stat-pill rounded-lg p-4 text-center">
          <p class="text-4xl font-semibold mono text-red-400 mb-1" id="occCount">–</p>
          <p class="text-xs text-slate-500 uppercase tracking-wide">Occupied</p>
        </div>
        <div class="stat-pill rounded-lg p-4 text-center">
          <p class="text-4xl font-semibold mono text-slate-300 mb-1" id="totalCount">–</p>
          <p class="text-xs text-slate-500 uppercase tracking-wide">Total</p>
        </div>
      </div>

      <div class="border-t border-slate-700/60 pt-5">
        <h4 class="text-xs text-slate-500 mono uppercase tracking-wider mb-3">Spot Status</h4>
        <ul id="spotList"
            class="space-y-1.5 overflow-y-auto h-72 pr-1 custom-scrollbar"
            role="list"
            aria-live="polite"
            aria-label="Individual parking spot statuses">
        </ul>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800 py-5" role="contentinfo">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-xs text-slate-600 mono">EasyPark UTSA © 2025</p>
    </div>
  </footer>

</body>
</html>
